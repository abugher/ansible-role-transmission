---
- include_vars:         "sensitive-inventory/host_vars/{{ inventory_hostname }}.yml"
- include_vars:         "sensitive/vars/main.yml"
- include_tasks:        'tasks/common/install_packages.yml'
- include_tasks:        'tasks/common/disable_services.yml'
- include_tasks:        'tasks/common/template_files.yml'
- include_tasks:        'tasks/common/create_files.yml'
- include_tasks:        'tasks/common/install_files.yml'
- include_tasks:        'tasks/common/symlinks.yml'
- include_tasks:        'tasks/common/restart_services.yml'
  when:                 template_files_result.changed
                        or install_files_result.changed
                        or symlinks_result.changed
# If settings.json changed, it needs to be written (again) while
# transmission-daemon is down, or else it will be overwritten with old settings
# on exit.
- include_tasks:        'tasks/common/stop_services.yml'
  when:                 template_files_result.changed
- include_tasks:        'tasks/common/template_files.yml'
  when:                 stop_services_result is defined and stop_services_result.changed
- include_tasks:        'tasks/common/start_services.yml'
  when:                 stop_services_result is defined and stop_services_result.changed

